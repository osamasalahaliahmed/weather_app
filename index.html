<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="styles.css">
   	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Weather App</title>
</head>
<body>
    <h1>WeatherMap</h1>
<form id="searchForm">
    <label for="searchBar">Location</label>
    <input id="searchBar" type="text" name="location" placeholder="Enter a location" >
    <button id="searchButton" type="submit">Get Weather</button>
    <button id="favButton" type="button">Add to Favourites</button>
    <div id="searchStatus"></div>
    <div id="favList"></div>
</form>
<div id="map"></div>



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
